@if (iniciando()) {
<div class="tela-inicial">
  <app-logo class="tela-inicial-logo" />
  <p class="tela-inicial-titulo">Caravellus</p>
  <p class="tela-inicial-texto">Iniciando o sistema&hellip;</p>
  <div class="tela-inicial-barra" role="progressbar" aria-label="Carregando o sistema"
       aria-valuemin="0" aria-valuemax="100" [attr.aria-valuenow]="progressoInicial()">
    <div class="tela-inicial-barra-preenchimento" [style.width.%]="progressoInicial()"></div>
  </div>
  <p class="tela-inicial-dica">Em computadores mais lentos, a abertura pode levar até um minuto.</p>
</div>
}
<router-outlet (activate)="aoAtivarTela($event)"></router-outlet>
<app-atualizacao-progresso />
