<h2 style="padding: 24px 24px 0; text-align: center;">{{ modoEdicao ? 'Editar Produto' : 'Novo Produto' }}</h2>
<div style="padding: 0 24px 24px; display: flex; flex-direction: column; gap: 4px; min-width: 320px;">
    <div class="imagem-campo">
        <div class="imagem-preview">
            @if (imagemPreview) {
            <img [src]="imagemPreview" alt="Imagem do produto">
            } @else {
            <mat-icon>image</mat-icon>
            }
        </div>
        <div class="imagem-botoes">
            <input #arquivoImagem type="file" accept="image/*" hidden (change)="selecionarImagem(arquivoImagem)">
            <button mat-stroked-button type="button" (click)="arquivoImagem.click()">
                <mat-icon>photo_camera</mat-icon>
                {{ imagemPreview ? 'Trocar imagem' : 'Escolher imagem' }}
            </button>
            @if (imagemPreview) {
            <button mat-button color="warn" type="button" (click)="removerImagem()">
                <mat-icon>delete</mat-icon>
                Remover
            </button>
            }
        </div>
    </div>
    <mat-form-field>
        <mat-label>Nome</mat-label>
        <input matInput [(ngModel)]="dados.nome" name="nome" (ngModelChange)="dados.nome = $event.toUpperCase()">
    </mat-form-field>
    <mat-form-field>
        <mat-label>Categoria</mat-label>
        <mat-select [(ngModel)]="categoriaId" name="categoria">
            <mat-option [value]="null">— Sem categoria —</mat-option>
            @for (c of data?.categorias ?? []; track c.id) {
            <mat-option [value]="c.id">{{ c.nome }}</mat-option>
            }
        </mat-select>
    </mat-form-field>
    <mat-form-field>
        <mat-label>Preço de custo (R$)</mat-label>
        <input matInput appValorMonetario [(ngModel)]="dados.preco_custo" name="preco_custo" type="text">
    </mat-form-field>
    <mat-form-field>
        <mat-label>Preço (R$)</mat-label>
        <input matInput appValorMonetario [(ngModel)]="dados.preco" name="preco" type="text">
    </mat-form-field>
    <mat-form-field>
        <mat-label>Estoque</mat-label>
        <input matInput [(ngModel)]="dados.estoque" name="estoque" type="number" min="0">
    </mat-form-field>
    @if (erro) { <p style="color: red; font-size: 0.85rem">{{ erro }}</p> }
    <div style="display: flex; gap: 8px; justify-content: center; margin-top: 8px;">
        <button mat-raised-button color="primary"
            [disabled]="!dados.nome || (dados.preco == null || dados.preco <= 0) || (dados.estoque == null || dados.estoque <= 0)" (click)="confirmar()">
            Salvar
        </button>
        <button mat-button (click)="fechar()">Cancelar</button>
    </div>
</div>
