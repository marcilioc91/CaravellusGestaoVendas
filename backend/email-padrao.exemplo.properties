# Conta de envio padrao do Caravellus (codigo de recuperacao de senha), via Brevo (SMTP).
#
# Copie este arquivo como backend/src/main/resources/email-padrao.properties e preencha login e chave.
# Ele vai embutido no JAR (o cliente nao precisa configurar nada) e fica FORA do Git (.gitignore).
# Um cliente pode usar outra conta informando os mesmos campos no config.properties.
#
# No Brevo (nome da conta, canto superior direito):
# 1. "Remetentes, dominios e IPs dedicados" > Remetentes: adicione e confirme o e-mail do remetente abaixo.
# 2. "SMTP e API" > SMTP: copie o Login (ex.: 9a1b2c001@smtp-brevo.com) e gere uma chave SMTP.
#
# Login SMTP do Brevo (NAO e o e-mail do remetente)
spring.mail.username=
# Chave SMTP do Brevo (NAO e a senha da conta)
spring.mail.password=
# E-mail que aparece como remetente (precisa estar confirmado no Brevo)
app.mail.remetente=portocabral.sistemas@gmail.com
